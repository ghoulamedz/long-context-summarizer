[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "long-context-summarizer"
version = "0.1.0"
description = "A long-context document summarizer and extractor using 60k context LLMs with 4096 token generation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Feynman Project", email = "team@feynman.ai"}
]
keywords = ["llm", "summarization", "long-context", "60k", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "llama-cpp-python>=0.2.77",
    "torch>=2.3.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "black>=24.3.0",
]

[project.scripts]
lcs = "long_context_summarizer.cli:main"
lcs-server = "long_context_summarizer.server:main"

[project.urls]
"Homepage" = "https://github.com/feynman/long-context-summarizer"
"Bug Tracker" = "https://github.com/feynman/long-context-summarizer/issues"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["__pycache__", ".git", "venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B904"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
strict = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --cov=long_context_summarizer --cov-report=term-missing"
